<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hydra | Dashboard Telemétrico</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .dash-kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 20px; }
        .kpi-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .kpi-info span { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .kpi-info h2 { margin: 5px 0 0 0; font-size: 28px; color: #0f172a; }
        
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .chart-box { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .chart-title { font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="sidebar">
            <div class="logo">HYDRA</div>
            <span id="doc-name-sidebar" style="color: var(--text-muted); font-size: 12px; font-weight: 600;">Cargando Médico...</span>
            <nav>
                <p onclick="window.location.href='home.html'" style="cursor: pointer;"><i class="fa-solid fa-users"></i> Pacientes</p>
                <p class="active"><i class="fa-solid fa-chart-pie"></i> Análisis Clínico</p>
            </nav>
            <div style="margin-top: auto;"><p onclick="window.location.href='Login.html'" style="cursor:pointer; color: var(--danger); font-weight: 600;"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</p></div>
        </div>

        <div class="content">
            <button class="btn-action outline" style="margin-bottom: 20px; border: none; padding-left: 0;" onclick="window.location.href='home.html?return=perfil'">
                <i class="fa-solid fa-arrow-left"></i> Volver al Perfil Clínico
            </button>

            <header class="header-dash" style="margin-bottom: 30px;">
                <div>
                    <h1 id="titulo-paciente">Análisis Telemétrico</h1>
                    <span id="subtitulo-rut" style="color: #64748b; font-size: 14px; font-weight: 500;">RUN: --------</span>
                </div>
            </header>

            <div class="dash-kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #e0e7ff; color: #4f46e5;"><i class="fa-solid fa-stopwatch"></i></div>
                    <div class="kpi-info">
                        <span>Promedio Uso Diario</span>
                        <h2 id="kpi-uso">0 hrs</h2>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #dcfce7; color: #16a34a;"><i class="fa-solid fa-battery-half"></i></div>
                    <div class="kpi-info">
                        <span>Eficiencia Batería</span>
                        <h2 id="kpi-bateria">0%</h2>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #fee2e2; color: #dc2626;"><i class="fa-solid fa-temperature-arrow-up"></i></div>
                    <div class="kpi-info">
                        <span>Temp. Máxima Motor</span>
                        <h2 id="kpi-temp">0°C</h2>
                    </div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-box">
                    <div class="chart-title"><i class="fa-solid fa-chart-column" style="color: #4f46e5;"></i> Evolución de Horas de Uso (Últimos 14 días)</div>
                    <canvas id="graficoUso"></canvas>
                </div>
                <div class="chart-box">
                    <div class="chart-title"><i class="fa-solid fa-chart-line" style="color: #dc2626;"></i> Calor Disipado (°C)</div>
                    <canvas id="graficoTemp"></canvas>
                </div>
            </div>

        </div> 
    </div> 

    <script src="../js/dashboard.js"></script>
</body>
</html>
